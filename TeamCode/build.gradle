// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [MY_OPMODE_GROUP: project.findProperty('shit') ?: ""]
            }
        }
    }
    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation project(':FtcRobotController')
//    implementation 'androidx.core:core-ktx:1.17.0'
}

tasks.register("updateVersionFromGit") {
    group = "versioning"
    description = "Writes GIT_DESCRIBE into gradle.properties"
    doLast {
        File propsFile = file("${rootProject.projectDir}/gradle.properties")
        Properties props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }
        props.setProperty("GIT_DESCRIBE", gitDescribe())
        propsFile.withOutputStream { props.store(it, "Updated by Gradle task") }
        println "gradle.properties updated: GIT_DESCRIBE=${props.getProperty('GIT_DESCRIBE')}"
    }
}

def gitDescribe() {
    try {
        def p = new ProcessBuilder("git", "describe", "--tags", "--dirty", "--always")
                .directory(rootProject.rootDir)
                .redirectErrorStream(true)
                .start()
        p.waitFor()
        return p.inputStream.text.trim()
    } catch (ignored) {
        return "unknown"
    }
}

def buildNumber= (String) project.findProperty('GIT_DESCRIBE') ?: ""

tasks.register('generateBuildConstants') {
    println buildNumber
    def outputDir = "${projectDir}/src/main/java"
    inputs.property("GIT-DESCRIBE", buildNumber)
    outputs.dir(outputDir)
    doLast {
        def pkg = "org.cr"
        def file = file("${outputDir}/${pkg.replace('.','/')}/BuildConstants.java")
        file.parentFile.mkdirs()
        file.text = """package ${pkg};
public final class BuildConstants {
  private BuildConstants() {}
  public static final String BUILD_NUMBER = \"${buildNumber}\" ;
  public static final String NAME = "Ball Thrower" + BUILD_NUMBER;
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/main/java"
        }
    }
}