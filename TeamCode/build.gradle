//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation project(':FtcRobotController')
//    implementation 'androidx.core:core-ktx:1.17.0'
}

tasks.register("updateVersionFromGit") {
    group = "versioning"
    description = "Writes GIT_DESCRIBE into gradle.properties"
    doLast {
        File propsFile = file("${rootProject.projectDir}/gradle.properties")
        Properties props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }
        props.setProperty("GIT_DESCRIBE", gitDescribe())
        propsFile.withOutputStream { props.store(it, "Updated by Gradle task") }
        println "gradle.properties updated: GIT_DESCRIBE=${props.getProperty('GIT_DESCRIBE')}"
    }
}

def gitDescribe = {
    try {
        def p = new ProcessBuilder("git", "describe", "--tags", "--dirty", "--always")
                .directory(rootProject.rootDir)
                .redirectErrorStream(true)
                .start()
        p.waitFor()
        return p.inputStream.text.trim()
    } catch (ignored) {
        return "unknown"
    }
}
